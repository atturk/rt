<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Nuova lezione</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
.r{font-family:system-ui,-apple-system,'Helvetica Neue',sans-serif;color:#171717;background:#ffffff;font-size:15px;line-height:1.55}
.mono{font-family:'SF Mono',ui-monospace,Menlo,monospace}
.meta{font-size:12px;color:#5c5c5c}
.ib{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:#171717;padding:0;font:inherit;cursor:pointer}
.ib.on{background:#f1f1f1}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid #d4d4d4;background:#ffffff;color:#171717;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.pri{background:#dceee7;border-color:#dceee7;color:#155f52;font-weight:600}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.big{height:48px;font-size:15px;justify-content:center}
.kbd{font-size:11px;opacity:.6;font-family:'SF Mono',ui-monospace,Menlo,monospace}
.tc{display:inline-block;border:1px solid #d4d4d4;border-radius:8px;padding:0 6px;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;color:#5c5c5c;line-height:1.6}
.lk{color:#155f52;font-weight:600;text-decoration:none;background:none;border:0;padding:0;font:inherit;font-size:13px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:#f1f1f1;font-size:12px;color:#171717;border:0;font-family:inherit}
.chip.on{background:#dceee7;color:#155f52;font-weight:600}
.sec{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#5c5c5c}
.card{border:1px solid #d4d4d4;border-radius:8px;padding:14px}
.claim{background:#fce9a8;border-radius:3px;color:#3c311b}
.under{text-decoration:underline;text-decoration-style:dotted;text-decoration-color:#b8860b;text-decoration-thickness:2px;text-underline-offset:3px}
.sel{background:rgba(21,95,82,.16)}
.dot{display:inline-block;width:8px;height:8px;border-radius:999px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:#5c5c5c}
.field input,.field select,.field textarea{height:34px;border:1px solid #d4d4d4;border-radius:8px;padding:0 10px;font:inherit;font-size:14px;color:#171717;background:#ffffff}
.field textarea{height:72px;padding:8px 10px;resize:none}
.row{display:flex;align-items:center;gap:8px}
.hr{height:1px;background:#e8e8e8}
a{color:#155f52}a:hover{color:#0e4038}
</style>
</helmet>
<div class="r" style="width: 1440px; height: 900px; display: flex; overflow: hidden; position: relative">
<nav aria-label="Sezioni" style="width: 56px; flex-shrink: 0; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px">
<button class="ib" style="background: #dceee7; color: #155f52" aria-label="Nuova lezione"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="ib" style="background: #dceee7; color: #155f52" aria-label="Lezioni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
<div style="flex: 1"></div>
<button class="ib" aria-label="Job in corso"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></button>
<button class="ib" aria-label="Impostazioni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</nav>
<div style="flex: 1; opacity: .35; padding: 24px 40px">
<p style="margin: 0; font-size: 17px; font-weight: 600">Lezioni</p>
</div>
<div role="dialog" aria-label="Nuova lezione" style="position: absolute; left: 50%; top: 120px; transform: translateX(-50%); width: 560px; border: 1px solid #d4d4d4; border-radius: 12px; background: #ffffff; box-shadow: 0 20px 50px rgba(0,0,0,.15); padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div class="row" style="justify-content: space-between"><p style="margin: 0; font-size: 17px; font-weight: 600">Nuova lezione</p><button class="ib" aria-label="Chiudi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div style="border: 1px dashed #c4c4c4; border-radius: 10px; padding: 14px; display: flex; align-items: center; gap: 12px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg><div style="flex: 1"><p style="margin: 0; font-size: 14px">emogas-2-ottobre.m4a</p><p class="meta" style="margin: 0">1 h 20 min · 74 MB</p></div><button class="lk" style="font-weight: 400">Cambia</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<div class="field"><label for="n-m">Materia</label><select id="n-m"><option>Fisiologia</option></select></div>
<div class="field"><label for="n-p">Docente</label><input id="n-p" value="Rossi"></div>
<div class="field"><label for="n-d">Data</label><input id="n-d" value="02/10/2026"></div>
<div class="field"><label for="n-o">Ora</label><input id="n-o" value="10:30"></div>
</div>
<p class="meta" style="margin: 0">{{ sentence }}</p>
<div class="row" style="justify-content: space-between">
<button class="ib" style="background: #dceee7; color: #155f52; width: 44px; height: 44px" aria-label="Avvia" title="Avvia"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></button>
<div class="row" role="group" aria-label="Fasi dopo l'importazione" style="gap: 6px">
<button class="ib" aria-pressed="{{ soloPressed }}" onClick="{{ toggleSolo }}" style="{{ soloStyle }}" aria-label="Solo trascrizione" title="Solo trascrizione"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg></button>
<button class="ib" aria-pressed="{{ reviewPressed }}" onClick="{{ toggleReview }}" style="{{ reviewStyle }}" aria-label="Revisione" title="Revisione"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></button>
<button class="ib" aria-pressed="{{ arrPressed }}" onClick="{{ toggleArr }}" style="{{ arrStyle }}" aria-label="Arricchimento" title="Arricchimento"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg></button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const solo = !!st.solo, review = !!st.review, arr = !!st.arr;
const on = 'background: #dceee7; color: #155f52; border: 1px solid #155f52';
const off = 'background: #ffffff; color: #171717; border: 1px solid #d4d4d4';
const dis = 'background: #ffffff; color: #c4c4c4; border: 1px solid #ececec; cursor: default';
let steps = ['trascrizione', 'scaletta', 'rielaborazione'];
if (review) steps.push('revisione');
if (arr) steps.push('arricchimento');
const list = steps.length > 1 ? steps.slice(0, -1).join(', ') + ' e ' + steps[steps.length - 1] : steps[0];
return {
soloPressed: solo ? 'true' : 'false', reviewPressed: review ? 'true' : 'false', arrPressed: arr ? 'true' : 'false',
soloStyle: solo ? on : off,
reviewStyle: solo ? dis : (review ? on : off),
arrStyle: solo ? dis : (arr ? on : off),
toggleSolo: () => this.setState({ solo: !solo }),
toggleReview: () => { if (!solo) this.setState({ review: !review }); },
toggleArr: () => { if (!solo) this.setState({ arr: !arr }); },
sentence: solo ? "Dopo l'importazione: solo trascrizione" : "Dopo l'importazione: " + list,
};
}
}
</script>
</body>
</html>
