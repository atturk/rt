<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rt.</title>
    <script>
      // Copia della preferenza condivisa prima del primo disegno.
      try {
        var legacy = localStorage.getItem('rt-theme')
        if (legacy !== null && localStorage.getItem('rt-pref:theme') === null) {
          var migrated = legacy === 'dark' ? 'scuro' : legacy === 'light' ? 'chiaro' : 'sistema'
          localStorage.setItem('rt-pref:theme', JSON.stringify(migrated))
          var pending = JSON.parse(localStorage.getItem('rt-pref:migrations') || '{}')
          pending.theme = migrated
          localStorage.setItem('rt-pref:migrations', JSON.stringify(pending))
        }
        localStorage.removeItem('rt-theme')
        var t = JSON.parse(localStorage.getItem('rt-pref:theme') || '"sistema"')
        if (t === 'scuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
