<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RT · Mini App Telegram</title>
<link rel="stylesheet" href="/mini-app/design.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="/mini-app/main.js"></script>
</head>
<body>
  <div class="stage">


    <div class="device">





      <div class="screen">
        <header class="tg-top">
          <button class="icon-btn tg-close" aria-label="Chiudi">
            <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <div class="tg-title" id="tgTitle">RT<small id="tgSub">appunti &amp; recall</small></div>
          <div class="tg-top-right">
            <button class="icon-btn" id="themeBtn" aria-label="Cambia tema" title="Tema: automatico">
              <svg id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>

          </div>
        </header>

        <main class="app" id="app"><div id="studyError" class="study-error" role="alert" hidden></div>
          <!-- ═══ 1 · ELENCO LEZIONI ═══ -->
          <section class="view active" id="view-lessons">
            <button class="btn btn-secondary btn-block" id="homeScreenBtn" hidden>Aggiungi alla schermata Home</button>
            <div class="section-label" id="practiceHeader">
              <div class="seg" id="practiceSeg" role="group" aria-label="Modalità di ripasso">
                <button class="seg-btn" type="button" data-pmode="materia" aria-label="Per materia" title="Per materia" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5h11a2 2 0 0 1 2 2V19H6a2 2 0 0 1-2-2V5.5Z"></path><path d="M7 8.5h6M7 12h6M17 8h2a2 2 0 0 1 2 2v9h-4"></path></svg></button>
                <button class="seg-btn" type="button" data-pmode="giorno" aria-label="Per giorno" title="Per giorno" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect><path d="M7.5 3.5v4M16.5 3.5v4M3.5 10h17M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"></path></svg></button>
              </div>
              <div id="practiceType" role="radiogroup" aria-label="Tipo di domanda">
                <button class="type-btn" type="button" role="radio" data-practice-type="quiz" aria-label="Quiz" title="Quiz" aria-checked="true" tabindex="0"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"></rect><path d="M9 3.5h6v3H9zM8.5 12l2 2 5-5M8.5 17h7"></path></svg></button>
                <button class="type-btn" type="button" role="radio" data-practice-type="mirata" aria-label="Mirata" title="Mirata" aria-checked="false" tabindex="-1"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="13" r="7.5"></circle><circle cx="11" cy="13" r="3"></circle><path d="m13.5 10.5 6-6M16 4.5h3.5V8"></path></svg></button>
                <button class="type-btn" type="button" role="radio" data-practice-type="vasta" aria-label="Vasta" title="Vasta" aria-checked="false" tabindex="-1"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 6.5c-2-2-5-2-8-1v13c3-1 6-1 8 1 2-2 5-2 8-1v-13c-3-1-6-1-8 1Z"></path><path d="M12 6.5v13M7 9h2M15 9h2M7 12h2M15 12h2"></path></svg></button>
                <button class="type-btn" type="button" role="radio" data-practice-type="mista" aria-label="Mista" title="Mista" aria-checked="false" tabindex="-1"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h2.5c4.5 0 6.5 10 11 10H20M17 14l3 3-3 3M4 17h2.5c1.8 0 3-1.5 4.2-3.3M13.5 9.3c1.2-1.5 2.4-2.3 4-2.3H20M17 4l3 3-3 3"></path></svg></button>
              </div>
            </div>
            <div class="subject-row" id="subjectRow"></div>
            <div class="day-list" id="dayRow" hidden></div>
            <div class="section-label"><h2>Lezioni</h2><span class="meta" id="lessonHead"></span></div>
            <div class="search">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="searchInput" type="search" placeholder="Cerca lezione o argomento" aria-label="Cerca lezioni" autocomplete="off" />
              <button class="clr" id="clearSearch" hidden aria-label="Cancella ricerca">✕</button>
            </div>
            <div class="chips" id="chips" role="group" aria-label="Filtra per materia"></div>
            <div id="lessonsLoading" hidden>
              <div class="skel"></div><div class="skel"></div><div class="skel"></div>
            </div>
            <div id="lessonsList"></div>
            <div class="empty" id="lessonsEmpty" hidden>
              <div class="glyph"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
              <p class="h3">Nessuna lezione trovata</p>
              <p class="hint">Prova con un’altra materia o un altro termine.</p>
            </div>
          </section>

          <!-- ═══ 2 · DETTAGLIO LEZIONE ═══ -->
          <section class="view" id="view-lesson"></section>

          <!-- ═══ 2b · LEGGI E RIPETI ═══ -->
          <section class="view" id="view-read"></section>

          <!-- ═══ 3 · PREPARAZIONE RECALL ═══ -->
          <section class="view" id="view-setup"></section>

          <!-- ═══ 4 · SESSIONE RECALL (domanda → feedback) ═══ -->
          <section class="view" id="view-recall">
            <div class="recall-top">
              <button class="back" id="exitRecall" style="margin:0">
                <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg> Esci
              </button>
              <span class="meta" id="qProg"></span>
            </div>
            <div class="bar" aria-hidden="true"><span id="qBar" style="width:0"></span></div>

            <div id="qPhase">
              <div class="qcard">
                <span class="pill" id="qType">Quiz</span>
                <h2 id="qText"></h2>
                <p class="meta" id="qUnits"></p>
              </div>
              <div id="qBody"></div>
              <div class="qactions" id="qActions"></div>
            </div>

            <div id="qGrading" class="progress-note" hidden>
              <span class="spinner"></span><span id="gradingText">Valutazione in corso…</span>
            </div>

            <div id="qFeedback" hidden></div>
          </section>

          <!-- ═══ 5 · RIEPILOGO ═══ -->
          <section class="view" id="view-summary"></section>
        </main>

        <div class="tg-bottom" hidden>
          <button class="mainbtn" id="mainBtn">Avvia</button>
        </div>


        <!-- ═══ 6 · CONSULTAZIONE UNITÀ (drawer) ═══ -->
        <div class="sheet" id="sheet">
          <div class="sheet-bd" id="sheetBd"></div>
          <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="sheet-head">
              <button class="back" id="sheetClose"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg> Indietro</button>
              <div>
                <div class="ctx" id="sheetCtx">Unità didattiche</div>
                <h2 id="sheetTitle">—</h2>
              </div>
            </div>
            <div class="sheet-body">
              <div id="sheetError" class="study-error" role="alert" hidden></div>
              <div class="u-list" id="sheetUnits"></div>
              <article class="unit-read" id="unitRead"></article>
            </div>
            <div class="sheet-foot" id="sheetFoot" hidden>
              <button class="btn btn-secondary btn-block" id="backToFeedback">
                <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
                Torna al feedback
              </button>
            </div>
          </div>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

</body></html>
