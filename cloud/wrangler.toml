# Backend RT Cloud su Cloudflare Workers. I segreti NON vanno qui: si impostano con
# `wrangler secret put NOME` (vedi README.md).
name = "rt-cloud"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "rt-cloud"
database_id = "SOSTITUIRE-con-l-id-di-wrangler-d1-create"

# Controllo del saldo OpenRouter ogni ora.
[triggers]
crons = ["17 * * * *"]

[vars]
# "sandbox" (pagamenti finti) oppure "production" (soldi veri).
POLAR_ENV = "sandbox"
# URL dove l'utente torna dopo il pagamento.
CHECKOUT_SUCCESS_URL = "https://github.com/atturk/rt"
# Piani: id interno, prodotto Polar (abbonamento mensile), etichetta.
# Il credito di un piano lungo arriva tutto al pagamento e vale per l'intero periodo.
PLANS = '''[{"id":"mese","polar_product_id":"SOSTITUIRE","label":"3,99 € al mese"},{"id":"semestre","polar_product_id":"SOSTITUIRE","label":"17,99 € ogni 6 mesi"},{"id":"anno","polar_product_id":"SOSTITUIRE","label":"29,99 € all'anno"}]'''
# Pool consigliato della modalità facilitata (il primo è il predefinito per le fasi di testo).
# Slug e prezzi da verificare sul listino OpenRouter prima di accendere il servizio.
# Gli altri modelli restano sceglibili dal catalogo OpenRouter dentro l'app.
MODEL_POOL = '''[
  {"id":"openai/gpt-6-luna","label":"GPT-6 Luna","note":"Economico, legge le immagini","recommended":true},
  {"id":"anthropic/claude-haiku-5.5","label":"Claude Haiku 5.5","note":"Economico, legge le immagini"},
  {"id":"deepseek/deepseek-v4.1-flash","label":"DeepSeek V4.1 Flash","note":"Open weight, legge le immagini; più caro di mattina"},
  {"id":"z-ai/glm-5.3-flash","label":"GLM-5.3 Flash","note":"Open weight, economico"},
  {"id":"google/gemini-3.5-flash-lite","label":"Gemini 3.5 Flash-Lite","note":"Circa 4 volte Luna"},
  {"id":"deepseek/deepseek-v4-pro","label":"DeepSeek V4 Pro","note":"Più intelligente, circa 3 volte Luna"}
]'''
# Modello con visione per la descrizione delle immagini (deve stare anche nel pool).
VISION_MODEL = "openai/gpt-6-luna"
# Quota del progetto (0.20 = 20%) sul netto di IVA e commissioni.
MARGIN = "0.20"
# Ricariche extra: prodotto Polar una tantum con prezzo "a scelta del cliente" (minimo 5 €).
# Il credito si somma a quello dell'abbonamento, si usa dopo di esso e vale 12 mesi.
# Lascia SOSTITUIRE per tenere le ricariche spente.
TOPUP_PRODUCT_ID = "SOSTITUIRE"
TOPUP_MARGIN = "0.10"
TOPUP_MIN_CENTS = "500"
TOPUP_MAX_CENTS = "20000"
TOPUP_VALID_DAYS = "365"
# Stima commissione Polar: percentuale + fisso in centesimi.
PAYMENT_FEE_PERCENT = "0.05"
PAYMENT_FEE_FIXED_CENTS = "50"
# Commissione OpenRouter sull'acquisto crediti.
OPENROUTER_FEE = "0.055"
# Cambio prudente da EUR a USD (i tetti OpenRouter sono in dollari).
EUR_TO_USD = "1.05"
# Sotto questo saldo OpenRouter (USD) arriva un avviso.
LOW_BALANCE_USD = "5"
# Prova su invito: solo queste email possono accedere (separate da virgole). Vuota = aperto a tutti.
# In sandbox va SEMPRE compilata: la carta di prova è finta ma il credito OpenRouter è vero.
ALLOWED_EMAILS = ""
MAIL_FROM = "RT <noreply@example.com>"
