version: "2.0.0"

mock_llm: false

streaming: true

show_monitor: true

retry:
  max_timeout_retries: 3
  timeout_backoff_seconds: 2.0
  idle_read_timeout_seconds: 30.0

review:
  asr_statistical_k: 3.0
  asr_statistical_floor: 0.35

# Pre-filtro Jev (System One di typesafe.ai) davanti alla critica scientifica LLM: disabilitato
# per default. "openrouter" indica la chiave OpenRouter configurata (la prima connessione
# OpenRouter, se il nome non corrisponde a una credenziale): senza, Jev resta inattivo.
# Soglie provvisorie: valuta con 'rt review --shadow-jev' prima di fidartene.
jev:
  enabled: false
  model: "typesafe/jev-1.13"
  credential: "openrouter"
  task_a_skip_confidence_threshold: 0.85
  task_b_fabrication_threshold: 0.80

# Nessuna credenziale preconfigurata: una nuova installazione parte senza connessioni.
# Aggiungile dalla web (Impostazioni › Connessioni) o con 'rt configure'.
credentials: []

telegram:
  default_channel: "terminal"
  # Cartella che raccoglie tutte le lezioni: 'rt build' vi sposta le lezioni finite, e la
  # dashboard principale (comando 'rt' senza sottocomando) la scansiona per elencarle tutte.
  # Se configurata, 'rt' (tasto 'n', nuova lezione) crea lì anche le lezioni nuove.
  lessons_root: null
  topics: {}
  misc_topic_id: null

# Motore usato dal setup delle lezioni. Un server custom deve supportare
# POST /audio/transcriptions e restituire verbose_json con segmenti temporizzati.
transcription:
  engine: "macparakeet"  # oppure "custom"
  base_url: null
  model: null
  timeout_seconds: 600

ui:
  theme: "dark"

# URL base dell'istanza SearXNG per la ricerca immagini web (richiesta da `rt add-images --web-search`).
# Si imposta anche dalla web: Impostazioni › Ricerca web. SearXNG deve avere il formato json
# abilitato (search.formats in settings.yml di SearXNG).
searxng_base_url: null  # es. "http://localhost:8088"

# L'analisi prepara idee; la generazione richiede sempre un'azione dell'utente.
enrichment:
  automatic: false  # true: analizza anche dentro la pipeline
  cap_mode: proportional  # off | fixed | proportional (numero di subunità)
  cap_number: 5
  utility_threshold: 0.65
  decision_model: typesafe/jev-1.13
  decision_credential: openrouter
  decision_base_url: https://openrouter.ai/api/alpha/decisions
  decision_timeout: 30
