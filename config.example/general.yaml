version: "2.0.0"

mock_llm: false

streaming: true

show_monitor: true

retry:
  max_timeout_retries: 3
  timeout_backoff_seconds: 2.0
  idle_read_timeout_seconds: 30.0

thresholds:
  green: 0.85
  yellow: 0.75

pricing_staleness_warning_days: 7

credentials:
  - name: "openrouter"
    provider: "openrouter"
    env_var: "OPENROUTER_API_KEY"