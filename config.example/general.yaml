# ==============================================================================
# config.example/general.yaml - Impostazioni Globali Pipeline & LLM
# ==============================================================================
# Copiare l'intera cartella 'config.example/' in 'config/' e personalizzare i file.
# La cartella 'config/' è ignorata da git per proteggere le impostazioni locali.
# ==============================================================================

version: "2.0.0"

# Impostare su true per eseguire la pipeline offline senza chiamate API (usa risposte mock deterministiche)
mock_llm: false

# Abilita lo streaming SSE delle risposte (mostra l'emissione token in tempo reale)
streaming: true

# Abilita il monitor interattivo con barra di avanzamento e metriche a terminale
show_monitor: true
# show_monitor_verbose: false

# Configurazione globale retry bounded per timeout di rete sulla stessa route
retry:
  max_timeout_retries: 1
  timeout_backoff_seconds: 2.0
  idle_read_timeout_seconds: 45.0

# ------------------------------------------------------------------------------
# SOGLIE DETERMINISTICHE PER CONFIDENCE GATING ASR
# ------------------------------------------------------------------------------
thresholds:
  green: 0.95   # >= 0.95 -> Correzione fonetica certa, auto-approvata nel ledger
  yellow: 0.75  # 0.75 - 0.94 -> Ambiguità plausibile, inserita nella coda di revisione
  # < 0.75      -> RED: Rischio elevato / dubbio, richiede verifica d'ascolto umana

# Giorni dopo i quali avvisare che i prezzi configurati non sono stati verificati con 'rt prices-check' (0 per disattivare l'avviso)
pricing_staleness_warning_days: 7

# ------------------------------------------------------------------------------
# ESEMPIO: PROVIDER GENERICO OPENAI-COMPATIBLE & CREDENTIALS CUSTOM
# ------------------------------------------------------------------------------
# Esempio: aggiungere un provider generico OpenAI-compatible (es. Mistral AI ufficiale).
# Decommentare e registrare qui le credenziali per usarle nei singoli file di job.
# credentials:
#   - name: "mistral_official"
#     provider: "openai_compatible"
#     env_var: "MISTRAL_API_KEY"

# ------------------------------------------------------------------------------
# ESEMPIO: PREZZI CUSTOM GLOBALI (sostituiscono le stime hardcoded in rt/llm/pricing.py)
# ------------------------------------------------------------------------------
# In alternativa al pricing per-route nei singoli file dei job, è possibile definire
# qui un listino custom globale per provider e modello:
# pricing:
#   deepseek:
#     deepseek-v4-flash:
#       input_per_million: 0.14
#       output_per_million: 0.28
