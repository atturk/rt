version: "2.0.0"

mock_llm: false

streaming: true

show_monitor: true

retry:
  max_timeout_retries: 3
  timeout_backoff_seconds: 2.0
  idle_read_timeout_seconds: 30.0

review:
  asr_statistical_k: 3.0
  asr_statistical_floor: 0.35

thresholds:
  green: 0.85
  yellow: 0.75

credentials:
  - name: "openrouter"
    provider: "openrouter"
    env_var: "OPENROUTER_API_KEY"

telegram:
  default_channel: "terminal"
  lessons_root: "/percorso/assoluto/cartella/che/contiene/tutte/le/lezioni"
  topics:
    BIOCHIMICA: 123
    FARMACOLOGIA: 456
  misc_topic_id: 789

# URL base dell'istanza SearXNG per la ricerca immagini web (richiesta da `rt add-images --web-search`)
# searxng_base_url: "http://localhost:8080"