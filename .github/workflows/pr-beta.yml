name: PR beta

# PR dei task della 4.2 verso il branch beta: girano solo i controlli delle parti toccate.
# Backend (pytest) solo se cambiano rt/, tests/ o i requirements; frontend (lint, typecheck,
# unit) solo se cambia frontend/. Gli e2e girano solo con l'etichetta 'e2e' sulla PR o a mano
# (workflow_dispatch) sul branch beta, prima di una prova dal vivo.
on:
  pull_request:
    branches: [claude/rt-4.2.3-beta]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'rt/**'
              - 'tests/**'
              - 'requirements*.txt'
              - 'constraints.txt'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: github.event.action != 'labeled' && needs.changes.outputs.backend == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q -n auto --dist loadfile

  frontend:
    needs: changes
    if: github.event.action != 'labeled' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Client API allineato
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - if: needs.changes.outputs.frontend == 'true'
        run: npm run lint
      - if: needs.changes.outputs.frontend == 'true'
        run: npm run typecheck
      - if: needs.changes.outputs.frontend == 'true'
        run: npm test

  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'e2e') || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium
          npm run build
      - working-directory: frontend
        env:
          RT_PYTHON: python
          RT_E2E_GROUP: recall-images
        run: npx playwright test
      - working-directory: frontend
        env:
          RT_PYTHON: python
          RT_E2E_GROUP: other
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
