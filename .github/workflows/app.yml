name: App

# L'app installabile (scripts/build_app.py): .dmg per il Mac e setup .exe per Windows, con la
# prova dell'installazione, dell'avvio e di una trascrizione vera con Parakeet ONNX. Su
# Windows gira anche la suite dei test. release.yml la richiama e allega gli installer.
on:
  pull_request:
    # anche le PR verso un branch beta (claude/rt-X.Y.Z-beta): gli installer si provano lì
    branches: [main, 'claude/rt-*-beta']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # modello Parakeet ONNX in cache fra un'esecuzione e l'altra (circa 700 MB)
  RT_STT_MODELS_DIR: ${{ github.workspace }}/.stt-models
  # la console dei runner Windows è cp1252: le emoji dei messaggi di RT la farebbero fallire
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_app.py --out dist
      - name: Check installer size
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/installer_size.py windows
      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\RT-*-windows-x64-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOLAUNCH=1',"/LOG=$env:RUNNER_TEMP\setup.log" -Wait
          Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 20
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\RT\python\python.exe")) { throw "RT non installato" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\RT\python\pythonw.exe")) { throw "Manca pythonw.exe" }
          $link = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\RT.lnk"
          if (-not (Test-Path $link)) { throw "Manca il collegamento a RT" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if ($shortcut.TargetPath -ne "$env:LOCALAPPDATA\Programs\RT\python\pythonw.exe") { throw "Il collegamento apre la console" }
      - name: Start the app
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\RT"
          python scripts/app_smoke.py "$app\python\python.exe" $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Lo smoke precedente termina il processo in primo piano; pulisce anche eventuali figli.
          Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith("$app\") } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Open the window
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\RT"
          python scripts/window_smoke.py "$app\python\pythonw.exe" $app --data "$env:RUNNER_TEMP\rt-window" --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/window_smoke.py "$app\python\pythonw.exe" $app --data "$env:RUNNER_TEMP\rt-window"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $console = Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app\*" }
          if ($console) { throw "L'app ha avviato python.exe invece di pythonw.exe" }
      - name: Silent update reopens the window
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\RT"
          $env:RT_DATA_DIR = "$env:RUNNER_TEMP\rt-window"
          $env:RT_WINDOW_SMOKE = '1'
          $env:RT_API_PORT = '8798'
          $env:RT_UPDATE_OFFLINE = '1'
          $oldPid = Get-Content "$env:RT_DATA_DIR\run\server.pid"
          Remove-Item "$env:RT_DATA_DIR\logs\window-smoke.json"
          $setup = Get-ChildItem dist\RT-*-windows-x64-setup.exe | Select-Object -First 1
          # -Wait aspetta anche il server rilanciato dal setup, che resta acceso.
          $install = Start-Process $setup.FullName -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$env:RUNNER_TEMP\update-setup.log" -PassThru
          if (-not $install.WaitForExit(120000)) { throw "Il setup non è terminato entro 120 secondi" }
          if ($install.ExitCode -ne 0) { throw "Aggiornamento non riuscito: $($install.ExitCode)" }
          python scripts/window_smoke.py "$app\python\pythonw.exe" $app --data $env:RT_DATA_DIR --wait-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content "$env:RT_DATA_DIR\run\server.pid") -eq $oldPid) { throw "Il server precedente non è stato sostituito" }
          $console = Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app\*" }
          if ($console) { throw "L'app ha aperto una console dopo l'aggiornamento" }
          Remove-Item Env:RT_WINDOW_SMOKE,Env:RT_DATA_DIR,Env:RT_API_PORT
      - uses: actions/cache@v4
        with:
          path: .stt-models
          key: stt-parakeet-tdt-0.6b-v3-int8-silero
      - name: Real transcription (Parakeet ONNX)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile("$env:RUNNER_TEMP\voice.wav")
          $voice.Speak("The kidney filters the blood. Today we study the nephron and the urine.")
          $voice.Dispose()
          $app = "$env:LOCALAPPDATA\Programs\RT"
          & "$app\python\python.exe" scripts\stt_smoke.py $app "$env:RUNNER_TEMP\voice.wav" "kidney,blood"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\RT\unins000.exe")) { exit 0 }
          Start-Process "$env:LOCALAPPDATA\Programs\RT\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$env:LOCALAPPDATA\Programs\RT\python") { throw "Disinstallazione incompleta" }
          $app = "$env:LOCALAPPDATA\Programs\RT"
          $left = Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith("$app\") }
          if ($left) { throw "Processi dell'app rimasti dopo la disinstallazione" }
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: |
            dist/RT-*-windows-x64-setup.exe
            dist/RT-*-windows-x64-setup.exe.size.json
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dmg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_app.py --out dist
      - name: Check installer size
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/installer_size.py macos
      - name: Install from the dmg
        run: |
          dmg=$(ls dist/RT-*-macos-arm64.dmg)
          mkdir -p "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/Applications"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" "$dmg"
          ditto "$RUNNER_TEMP/mnt/RT.app" "$RUNNER_TEMP/Applications/RT.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          test -x "$RUNNER_TEMP/Applications/RT.app/Contents/MacOS/RT"
      - name: Start the app
        run: |
          app="$RUNNER_TEMP/Applications/RT.app/Contents/Resources/app"
          python scripts/app_smoke.py "$app/python/bin/python3" "$app"
      - name: Open the window
        run: |
          app="$RUNNER_TEMP/Applications/RT.app/Contents/Resources/app"
          python scripts/window_smoke.py "$app/python/bin/python3" "$app" --data "$RUNNER_TEMP/rt-window" --quit
          python scripts/window_smoke.py "$app/python/bin/python3" "$app" --data "$RUNNER_TEMP/rt-window"
      - name: Open file with the app
        run: |
          echo "Testo per la nuova lezione" > "$RUNNER_TEMP/prova.txt"
          open -a "$RUNNER_TEMP/Applications/RT.app" "$RUNNER_TEMP/prova.txt"
          sleep 3
          grep -q "File aperto:" "$RUNNER_TEMP/rt-window/logs/desktop.log" || {
            echo "desktop.log:"
            cat "$RUNNER_TEMP/rt-window/logs/desktop.log" || true
            exit 1
          }
      - uses: actions/cache@v4
        with:
          path: .stt-models
          key: stt-parakeet-tdt-0.6b-v3-int8-silero
      - name: Real transcription (Parakeet ONNX)
        run: |
          say -v Alice -o "$RUNNER_TEMP/voce.wav" --file-format=WAVE --data-format=LEI16@16000 \
            "Il rene filtra il sangue. Oggi studiamo il nefrone e la produzione di urina." \
            || say -o "$RUNNER_TEMP/voce.wav" --file-format=WAVE --data-format=LEI16@16000 \
               "The kidney filters the blood. Today we study the nephron."
          app="$RUNNER_TEMP/Applications/RT.app/Contents/Resources/app"
          words=$(say -v '?' | grep -q '^Alice ' && echo "rene,sangue" || echo "kidney,blood")
          "$app/python/bin/python3" scripts/stt_smoke.py "$app" "$RUNNER_TEMP/voce.wav" "$words"
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: |
            dist/RT-*-macos-arm64.dmg
            dist/RT-*-macos-arm64.dmg.size.json
          if-no-files-found: error
          retention-days: 7

  # La suite dei test su Windows: quello che funziona solo sul Mac salta fuori qui.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests/ -q -n auto --dist loadfile
