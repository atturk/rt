name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check version and distribution contents
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --output dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package SPA
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="rt-spa-${RELEASE_TAG#v}.tar.gz"
          tar -C frontend/dist -czf "dist/$archive" .
          (cd dist && shasum -a 256 "$archive" >> SHA256SUMS)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rt-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
