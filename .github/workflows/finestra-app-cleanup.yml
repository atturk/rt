name: Pulizia prove finestra

on:
  push:
    branches: [feature/finestra-app]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            // Ferma soltanto le prove superate di questo branch.
            await new Promise(resolve => setTimeout(resolve, 30000));
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'feature/finestra-app'});
            const current = branch.data.commit.sha;
            for (const workflow_id of ['app.yml', 'tests.yml']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id, branch: 'feature/finestra-app', event: 'pull_request', per_page: 100
              });
              for (const run of runs) {
                if (run.head_sha === current || run.status === 'completed') continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                } catch (error) {
                  if (error.status !== 409) throw error;
                }
                core.info(`Prova superata fermata: ${run.id}`);
              }
            }
